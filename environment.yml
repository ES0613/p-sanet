# Windows 11 ARM64 hosts must create this environment with x64 Miniconda/Python.
# Native win-arm64 Python is not supported by the pinned binary dependency stack.
name: p-sanet
channels:
  - conda-forge
  - pytorch
dependencies:
  - python=3.11.15
  - numpy=2.4.2
  - pandas=3.0.1
  - scipy=1.17.1
  - rdkit=2025.09.6
  - pytorch=2.5.1
  - transformers=4.46.3
  - tokenizers=0.20.3
  - safetensors=0.7.0
  - tqdm=4.67.3
  - regex=2026.2.28
  - pip
  - pip:
      - pytest==8.3.5
      - pytest-cov==6.0.0
      - -e .
